site_name: Koalafied Wiki
use_directory_urls: false
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
    - search.share

nav:
  - Home: index.md
  - Basic Electrical Knowledge: basic-electrical-knowledge.md
  - Basic Electrical Knowledge II: basic-electrical-knowledge-ii.md
  - Basic Soldering: basic-soldering.md
  - Power Soldering: power-soldering.md
  - Component Soldering: component-soldering.md
  - Common Component Connectors: common-component-connectors.md
  - Anderson Powerpole Connectors: anderson-powerpole-connectors.md
  - Specialised Component Connectors: specialised-component-connectors.md
  - Spade Connectors: spade-connectors.md
  - Deutsch DTM Connectors: deutsch-dtm-connectors.md
  - Basic Circuit Design: basic-circuit-design.md
  - Circuit Topologies: circuit-topologies.md
  - Belly/Brainpan Layout: belly-brainpan-layout.md
  - Wire Gauge Selection: wire-gauge-selection.md
  - Mechanism Wiring Layout: mechanism-wiring-layout.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences

extra_css:
  - https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,600;0,800;1,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
